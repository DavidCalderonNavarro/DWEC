    <h1>Ejercicio 1</h1>
    <h3>Realiza un ejercicio que te cree un array con 50 números random (Math.random) con un bucle y
        que te calcule el mayor menor, media.</h3>

    <script>

        var array = new Array(50)
        let numRadom = 0

        for(i = 0; i < 50; i++){

            numRadom = Math.random()
            document.writeln(array.push(numRadom))

        }





    </script>
