<body>

    <h1>Ejercicio 7</h1>

    <p>Concatenar dos arrays A y B de la siguiente forma: A0, B0, A1, B1, A2, B2, ..., An, Bn. Los
        vectores tendrán la misma longitud.</p>

    <script>

        const array1 = ["elemento1", "elemento2", "elemento3"];
        const array2 = ["elemento4", "elemento5", "elemento6"];

        const union = [];

        for (let i = 0; i < array1.length; i++) {

            union.splice(union.length, 0, array1[i]);
            union.splice(union.length, 0, array2[i]);

        }

        document.writeln(union);
    </script>

</body>
