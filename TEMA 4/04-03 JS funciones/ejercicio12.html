<body>

    <h1>Ejercicio 12</h1>
    <p>Haz un ejercicio que calcule el factorial de un numero de manera recursiva.</p>

    <script>

        function factorial(valor) {

            if (valor == 0 || valor == 1) {
                return 1;
            }
            else {
                return valor * factorial(valor - 1);
            }

        }

        document.write("El factorial de 5 es: " + factorial(5));

    </script>

</body>
