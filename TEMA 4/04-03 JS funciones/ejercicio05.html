    <h1>Ejercicio 5</h1>
    <p>Crea una función anónima con flechas que calcule el cuadrado de un numero y asigna lo a una
        variable y ejecutalo.</p>

    <script>

        let cuadrado = (numero) => {
            return numero * numero;
        };

        document.write(cuadrado(5));

    </script>
