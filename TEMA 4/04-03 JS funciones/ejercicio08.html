<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>
</head>

<body>

    <h1>Ejercicio 8</h1>
    <p>Escribe una función que genere al azar 20 números enteros comprendidos entre 0 y 9.
        Estos números se deben introducir en un array de 4 filas por 5 columnas y mostrárnoslo como un string
        que sea una tabla</p>

    <script>

        function generarNumeros(){

            let matriz = []
            resultado = "<table border='1'>"

            for(let i = 0; i < 4; i++){

                matriz[i] = []
                resultado += "<tr>"

                for(let j = 0; j < 5; j++){

                    let numero = Math.floor(Math.random() * 10)

                    matriz[i][j] = numero

                    resultado += "<td>" + matriz[i][j] + "</td>"

                }

                resultado += "</tr>"

            }

            resultado += "</table>"

            document.writeln(resultado)

            return matriz

        }

        generarNumeros();

    </script>

</body>

</html>
