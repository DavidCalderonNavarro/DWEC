<body>

    <h1>Ejercicio 4</h1>
    <p>Crea una función anónima que calcule el triple de un numero y asigna lo a una variable y
        ejecutalo.</p>

    <script>

        let triple = function (numero) {
            return numero * 3;
        };

        document.write(triple(5));

    </script>
