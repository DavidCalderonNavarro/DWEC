<body>

    <h1>Ejercicio 11</h1>
    <p>Observa esta función recursiva</p>

    <script>

        function factorial(valor) {
            if (valor == 1) return 1;
            else return valor + factorial(valor - 1);
        }

        document.write(factorial(5));

    </script>

</body>
