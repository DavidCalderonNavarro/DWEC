<body>

    <h1>Ejercicio 1</h1>
    <p>Crear un Set de Personajes Crea un conjunto (Set) llamado personajesSet e agrega
        al menos cinco personajes de "El Señor de los Anillos" como elementos.</p>

    <script>

        let personajesSet = new Set()

        personajesSet.add("Frodo");
        personajesSet.add("Gandalf");
        personajesSet.add("Aragorn");
        personajesSet.add("Legolas");
        personajesSet.add("Gimli");

    </script>

</body>
