<body>

    <h1>Ejercicio 7</h1>
    <p>Combinar dos Sets de Personajes Crea dos conjuntos de personajes, set1 y set2, y
        luego escribe una función que combine ambos conjuntos en uno solo. Asegúrate de que no haya
        elementos duplicados en el nuevo conjunto.</p>

    <script>

        let set1 = new Set();
        let set2 = new Set();

        function unirSets(set1, set2){

            union(set1, set2);

        }

        document.writeln(unirSets(set1, set2));

    </script>

</body>
