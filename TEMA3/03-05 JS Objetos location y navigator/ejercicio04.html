<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>
<body>

    <h1>Ejercicio 4</h1>
    <h3>Modifica este ejemplo para que cargue el valor que se le pase desde un input text o un prompt</h3>

    <h2>The assign Property of Location Object</h2>
    <button onclick="myFunction()">Load new document</button>
    
    <script>
        let entrada = prompt("Dime una pagina: ")

        function myFunction() {
            //Sirve para navegar a otra pagina
            location.assign(entrada);
        }
    </script>
    
</body>
</html>
