<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>

    <h1>Ejercicio 6</h1>
    <h3>Haz un ejemplo de window.replace() añadiendo un botón al anterior ejercicio</h3>

    <h2>The assign Property of Location Object</h2>
    <button onclick="myFunction()">Load new document</button>
    <button onclick="location.reload()">Recargar</button>
    <button onclick="location.replace()">Reemplazar</button>

    <script>
        let entrada = prompt("Dime una pagina: ")

        function myFunction() {
            //Sirve para navegar a otra pagina
            location.assign(entrada);
        }
    </script>
    
</body>
</html>
