<body>

    <h1>Ejercicio 10</h1>
    <h3>Ejecuta el siguiente codigo y explica que hace la variable expresion y hallado match() Busca una coincidencia
        entre una expresión regular y una cadena y devuelve las coincidencias o null si no ha encontrado nada.</h3>

    <script>

        cadena = "<br>Los temas son tema 1, tema 3, tema 5 y tema 6";
        //expresion = /(capítulo \d+(\.\d)*)/i;
        expresion = /(tema \d+)/i; //tema = busca la palabra tema, \d+ = busca uno o mas numeros, () = crea un grupo, i = ignora las letras si son mayusculas o minusculas
        hallado = cadena.match(expresion); //Busca en la cadena una coincidencia con el patron de expresion
        document.write(cadena + "<br> expresion en " + hallado[1]);

    </script>

</body>
