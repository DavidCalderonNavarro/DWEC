<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 12</title>
</head>

<body>

    <h1>Ejercicio 12</h1>
    <h3>search() Busca una subcadena en la cadena y devuelve la posición dónde se encontró.</h3>

    <script>

        let entrada1 = window.prompt("Introduce el texto donde buscar:");
        let entrada2 = window.prompt("Introduce la palabra que quieres buscar:");

        let encontrado = entrada1.search(entrada2);

        document.write("Posición encontrada: " + encontrado);

    </script>

</body>

</html>
