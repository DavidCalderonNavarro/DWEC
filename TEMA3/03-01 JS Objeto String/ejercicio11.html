<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
</head>
<body>

    <h1>Ejercicio 11</h1>
    <h3>Toma dos entradas con window.prompt() y que se reemplace la primera en la segunda replace()</h3>

    <script>

        let entrada1 = window.prompt("Dime la primera entrada: ");
        let entrada2 = window.prompt("Dime la segunda entrada: ");

        let reemplazo = entrada1.replace(entrada2);

        document.writeln(reemplazo);

    </script>
    
</body>
</html>
