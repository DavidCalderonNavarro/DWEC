<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    
    <h1>Ejercicio 2</h1>
    <h3>Toma una entrada con window.prompt() y nos muestre el caracter que esta en la mitad con charAt()</h3>

    <script>

        let palabra = window.prompt("Dime algo: ");
        document.writeln("Caracter en mitad: " + palabra.charAt(palabra.length / 2))

    </script>
    
</body>
</html>
