<!DOCTYPE html>
<html lang="en">

<head>

    <title>Ejercicio 16</title>
</head>

<body>

    <h1>Ejercicio 16</h1>
    <h3>substring() Extrae los caracteres de una cadena entre dos índices especificados.</h3>

    <script>

        let texto = "Hola mundo";

        let resultado = texto.substring(0, 4);

        document.writeln(resultado);

    </script>

</body>
