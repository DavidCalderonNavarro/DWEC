<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14</title>
</head>

<body>

    <h1>Ejercicio 14</h1>
    <h3>Toma una entradas con window.prompt() Divide una cadena en un array de subcadenas separados por
        palabras. split()</h3>

    <script>

        let entrada = window.prompt("Dime una frase: ");

        let palabras = entrada.split(" ");

        document.writeln(palabras);

    </script>

</body>
