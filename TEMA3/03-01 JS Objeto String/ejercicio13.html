<!DOCTYPE html>

    <title>Ejercicio 13</title>
</head>
<body>

    <h1>Ejercicio 13</h1>
    <h3>Toma una entradas con window.prompt() y Extrae (la mitad) de la cadena . slice()</h3>

    <script>

        let entrada = window.prompt("Dime algo: ");

        let mitad = String.slice(entrada);

        document.writeln("Mitad: " + mitad);

    </script>
    
</body>
