<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios 5</title>
</head>
<body>

    <h1>Ejercicio 5</h1>
    <h3>Toma dos entradas con window.prompt() y unelas</h3>

    <script>

        let entrada1 = window.prompt("Primera entrada: ");
        let entrada2 = window.prompt("Segunda entrada: ");

        let juntas = entrada1.concat(entrada2);

        document.writeln(juntas);

    </script>
    
</body>
</html>
