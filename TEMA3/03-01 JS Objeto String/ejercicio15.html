<!DOCTYPE html>

<body>

    <h1>Ejercicio 15</h1>
    <h3>substr() Extrae los caracteres de una cadena, comenzando en una determinada posición y con el número
        de caracteres indicado.</h3>

    <script>

        let texto = "Hola mundo";

        let resultado = texto.substr(2, 4);

        document.writeln(resultado);

    </script>

</body>
