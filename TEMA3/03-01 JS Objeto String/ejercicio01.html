<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>

    <h1>Ejercicio 1</h1>
    <h3>Toma una entrada con window.prompt() y muestra su tamaño</h3>

    <script>

        let tamaño = window.prompt("Dime algo: ");

        document.writeln("Tamaño: " + tamaño.length);

    </script>
    
</body>
</html>
