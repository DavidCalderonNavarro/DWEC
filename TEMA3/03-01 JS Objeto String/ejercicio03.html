<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>

    <h1>Ejercicio 3</h1>
    <h3>Modifica el anterior para que muestre tambien su codigo Unicode</h3>

    <script>

        let palabra = window.prompt("Dime algo: ");
        document.writeln("Caracter en mitad: " + palabra.charAt(palabra.length / 2))
        document.writeln("<br>UniCode: " + palabra.charCodeAt());

    </script>
    
</body>
</html>
