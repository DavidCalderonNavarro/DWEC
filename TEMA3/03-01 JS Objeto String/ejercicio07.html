<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>

<body>

    <h1>Ejercicio 7</h1>
    <h3>Toma dos entradas con window.prompt() y que se busque la primera aparicion de la primera entrada en la
        segunda con indexOf().</h3>

    <script>

        let entrada1 = window.prompt("Primera entrada: ");
        let entrada2 = window.prompt("Segunda entrada");

        let aparicion = entrada1.indexOf(entrada2);

        document.writeln("Aparición: " + aparicion);

    </script>

</body>

</html>
