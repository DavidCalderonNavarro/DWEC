<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>
</head>

<body>

    <h1>Ejercicio 8</h1>
    <h3>Toma dos entradas con window.prompt() y que se busque la primera en la segunda indexOf()</h3>

    <script>

        let entrada1 = window.prompt("Introduce la palabra que quieres buscar:");
        let entrada2 = window.prompt("Introduce el texto donde quieres buscar:");

        let posicion = entrada2.indexOf(entrada1);

        document.writeln("Posición: " + posicion);

    </script>

</body>

</html>
