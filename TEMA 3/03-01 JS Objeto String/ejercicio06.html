<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>

    <h1>Ejercicio 6</h1>
    <h3>Toma una numero (si no es un numero da error) y muestra su carácter unicode asociado. FromCharCode().</h3>

    <script>

        let num = Number(prompt("Dime un numero: "));

        if(isNaN(num)){

            document.writeln("Error");

        }else{

            let unicode = String.fromCharCode(num);
            document.writeln("UniCode: " + unicode);

        }

    </script>
    
</body>
</html>
