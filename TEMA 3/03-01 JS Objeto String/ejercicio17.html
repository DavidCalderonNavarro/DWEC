<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios 17</title>
</head>

<body>

    <h1>Ejercicio 17</h1>
    <h3>Toma una entrada con window.prompt() y ponlo en en minúsculas Y en mayúsculas con toLowerCase()
        toUpperCase()</h3>

    <script>

        let entrada = window.prompt("Dime algo: ");

        let minus = entrada.toLowerCase();
        let mayus = entrada.toUpperCase();

        document.writeln("En minuscula: " + minus);
        document.writeln("<br>En mayuscula: " + mayus);

    </script>

</body>

</html>
