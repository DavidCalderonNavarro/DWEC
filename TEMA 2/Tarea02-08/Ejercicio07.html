<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>

<body>

    <h1>Ejercicio 7</h1>
    <h3>Copia este codigo y ejecutalo modificalo para hacerlo con un while y un do loop</h3>

    <form name="selectForm">
        <p>
            <label for="musicTypes">Elija algunos tipos de música, luego haga clic en el botón de
                abajo:</label>
            <select id="musicTypes" name="musicTypes" multiple="multiple">
                <option selected="selected">R&B</option>
                <option>Jazz</option>
                <option>Blues</option>
                <option>New Age</option>
                <option>Classical</option>
                <option>Opera</option>
            </select>
        </p>
        <p><input id="btn" type="button" value="¿Cuántos están seleccionados?" /></p>
    </form>
    <script>
        function howMany(selectObject) {
            let numberSelected = 0;
            let i = 0;

            while (i < selectObject.options.length) {
                if (selectObject.options[i].selected) {
                    numberSelected++;
                }
                i++;
            }

            //if (selectObject.options.length > 0) {
            //do {
                //if (selectObject.options[i].selected) {
                    numberSelected++;
                //}
                //i++;
            //} while (i < selectObject.options.length);
            //}

        return numberSelected;
        }

        let btn = document.getElementById("btn");

        btn.addEventListener("click", function () {
            alert(
                "Número de opciones seleccionadas: " +
                howMany(document.selectForm.musicTypes)
            );
        });
    </script>

</body>

</html>
