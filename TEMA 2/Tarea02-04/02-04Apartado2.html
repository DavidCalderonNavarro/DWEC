<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartado2</title>
</head>

<body>
    <script>

        let a;

        // Asignación =
        a = 10;
        document.write("a = 10 : " + a + "<br>");

        // Suma y asignación +=
        a = 10;
        a += 5;
        document.write("a += 5 : " + a + "<br>");

        // Resta y asignación -=
        a = 10;
        a -= 5;
        document.write("a -= 5 : " + a + "<br>");

        // Multiplicación y asignación *=
        a = 10;
        a *= 5;
        document.write("a *= 5 : " + a + "<br>");

        // División y asignación /=
        a = 10;
        a /= 5;
        document.write("a /= 5 : " + a + "<br>");

        // Resto y asignación %=
        a = 10;
        a %= 3;
        document.write("a %= 3 : " + a + "<br>");

        // Desplazamiento a la izquierda
        a = 8;
        a <<= 2;
        document.write("a <<= 2 : " + a + "<br>");

        // Desplazamiento a la derecha
        a = 32;
        a >>= 2;
        document.write("a >>= 2 : " + a + "<br>");

        // Desplazamiento a la derecha sin signo
        a = 32;
        a >>>= 2;
        document.write("a >>>= 2 : " + a + "<br>");

        // AND bit a bit &=
        a = 15;
        a &= 9;
        document.write("a &= 9 : " + a + "<br>");

        // OR bit a bit |=
        a = 15;
        a |= 9;
        document.write("a |= 9 : " + a + "<br>");

        // XOR bit a bit ^=
        a = 15;
        a ^= 9;
        document.write("a ^= 9 : " + a + "<br>");

        // Acceso mediante []
        let numeros = [10, 20, 30];
        document.write("numeros[0] : " + numeros[0] + "<br>");

    </script>
</body>

</html>
