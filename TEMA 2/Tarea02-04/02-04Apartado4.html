<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartado4</title>
</head>

<body>

    <table border="1">
        <tr>
            <th>A</th>
            <th>Op</th>
            <th>B</th>
            <th>Resultado</th>
        </tr>

        <tr>
            <td>True</td>
            <td>&&</td>
            <td>True</td>
            <td>
                <script>
                    document.write(true && true);
                </script>
            </td>
        </tr>

        <tr>
            <td>True</td>
            <td>&&</td>
            <td>False</td>
            <td>
                <script>
                    document.write(true && false);
                </script>
            </td>
        </tr>

        <tr>
            <td>False</td>
            <td>&&</td>
            <td>True</td>
            <td>
                <script>
                    document.write(false && true);
                </script>
            </td>
        </tr>

        <tr>
            <td>False</td>
            <td>&&</td>
            <td>False</td>
            <td>
                <script>
                    document.write(false && false);
                </script>
            </td>
        </tr>
    </table>

</body>

</html>
