<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
    
        let decimal = parseInt("10010111", 2);

        let segundoparametroBinario;
        let segundoparametro;

        let DesplazamientoAND;
        let DesplazamientoOR;
        let DesplazamientoXOR;
        let DesplazamientoNOT;
        let Desplazamientoizquierda;
        let Desplazamientoderecha;
        let Desplazamientoderecha0;


        segundoparametroBinario = "00000000";
        segundoparametro = parseInt(segundoparametroBinario, 2);

        DesplazamientoAND = decimal & segundoparametro;


        segundoparametroBinario = "11111111";
        segundoparametro = parseInt(segundoparametroBinario, 2);

        DesplazamientoOR = decimal | segundoparametro;



        segundoparametroBinario = "10010110";
        segundoparametro = parseInt(segundoparametroBinario, 2);

        DesplazamientoXOR = decimal ^ segundoparametro;


   
        segundoparametroBinario = "00001001";
        segundoparametro = parseInt(segundoparametroBinario, 2);

        DesplazamientoNOT = ~segundoparametro;



        segundoparametroBinario = "00010000";
        segundoparametro = parseInt(segundoparametroBinario, 2);

        Desplazamientoizquierda = segundoparametro << 1;



        segundoparametroBinario = "00010000";
        segundoparametro = parseInt(segundoparametroBinario, 2);

        Desplazamientoderecha = segundoparametro >> 1;


        segundoparametroBinario = "10000000";
        segundoparametro = parseInt(segundoparametroBinario, 2);

        Desplazamientoderecha0 = segundoparametro >>> 2;


        document.writeln("<br>AND = " + DesplazamientoAND);
        document.writeln("<br>OR = " + DesplazamientoOR);
        document.writeln("<br>XOR = " + DesplazamientoXOR);
        document.writeln("<br>NOT = " + DesplazamientoNOT);
        document.writeln("<br>Desplazamiento izquierda = " + Desplazamientoizquierda);
        document.writeln("<br>Desplazamiento derecha = " + Desplazamientoderecha);
        document.writeln("<br>Desplazamiento derecha 0 = " + Desplazamientoderecha0);
        
        </script>

</body>

</html>
