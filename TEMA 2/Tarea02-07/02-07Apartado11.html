<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
</head>

<body>

    <h3>Ejercicio 11 Escribir un programa que pida al usuario una palabra y luego muestre por pantalla una a una
        las letras de la palabra introducida empezando por la última.</h3>
    <br><br>

    <script>

        let palabra = prompt("Dime una palabra: ");
        let letras = palabra.split('');

       document.writeln(letras.reverse());

    </script>

</body>

</html>
