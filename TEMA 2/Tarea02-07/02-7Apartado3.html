<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>

<body>

    <h3>Ejercicio 3 Escribir un programa que pida al usuario un número entero positivo y muestre por pantalla
        todos los números impares desde 1 hasta ese número separados por comas.</h3>
    <br><br>

    <script>

        let numero = parseInt(prompt("Dime un numero: "));

        for (var i = 1; i <= numero; i += 2) {

            document.writeln(i, ",")

        }

    </script>

</body>

</html>
