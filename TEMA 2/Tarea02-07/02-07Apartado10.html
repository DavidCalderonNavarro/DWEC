<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
</head>

<body>

    <h3>Ejercicio 10 Escribir un programa que pida al usuario un número entero y muestre por pantalla si es un
        número primo o no.</h3>
    <br><br>

    <script>

        let numero = parseInt(prompt("Dime un numero: "));
        let primo = true;

        for (let i = 2; i < numero; i++) {

            if (numero % i == 0) {

                primo = false;

            }

        }

        if (primo) {

            document.writeln("Tu numero es primo");

        } else {

            document.writeln("Tu numero no es primo");

        }

    </script>

</body>

</html>
