<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>
<body>

    <h3>Ejercicio 7 Escribir un programa que muestre por pantalla la tabla de multiplicar del 1 al 10.</h3>
    <br><br>

    <script>

        for(let i = 1; i<= 10; i++){

            document.writeln("<h5>Tabla del " + i + "</h5>");

            for(let numero = 1; numero <= 10; numero++){

                document.writeln(i + " x " + numero + " = " + (i*numero) + "<br>");

            }

        }

    </script>
    
</body>
</html>
