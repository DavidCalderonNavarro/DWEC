<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>

<body>

    <h3>Ejercicio 6 Escribir un programa que pida al usuario un número entero y muestre por pantalla un triángulo
        rectángulo como el de más abajo, de altura el número introducido.</h3>
    <br><br>

    <script>

        let numero = parseInt(prompt("Dime un numero: "));
        let veces = 0;

        for (let i = 0; i <= numero; i++) {

            for (let a = 0; a < veces; a++) {

                document.writeln("*");

            }

            veces += 1;
            document.writeln("<br>");

        }

    </script>

</body>

</html>
