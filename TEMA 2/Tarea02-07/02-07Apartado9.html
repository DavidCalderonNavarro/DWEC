<body>

    <h3>Ejercicio 9 Escribir un programa que almacene la cadena de caracteres contraseña en una variable,
        pregunte al usuario por la contraseña hasta que introduzca la contraseña correcta.</h3>
    <br><br>

    <script>

        let cadena;
        let contraseña = "bucles";

        do{

            cadena = prompt("Dime la contraseña: ");

        }while(cadena != contraseña)

        document.writeln("Constraseña correcta");

        

    </script>

</body>
