<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>

<body>

    <h3>Ejercicio 4 Escribir un programa que pida al usuario un número entero positivo y muestre por pantalla la
        cuenta atrás desde ese número hasta cero separados por comas.</h3>
    <br><br>

    <script>

        let numero = parseInt(prompt("Dime un numero: "));

        for (var i = numero; i >= 0; i--) {

            document.writeln(i, ",");

        }

    </script>

</body>

</html>
