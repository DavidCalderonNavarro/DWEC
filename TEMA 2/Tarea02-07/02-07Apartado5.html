<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>

<body>

    <h3>Ejercicio 5 Escribir un programa que pregunte al usuario una cantidad a invertir, el interés anual y el
número de años, y muestre por pantalla el capital obtenido en la inversión cada año que dura la inversión.</h3>
<br><br>

    <script>

        let cantidad = parseInt(prompt("Cantidad a invertir: "));
        let intereses = parseInt(prompt("Interes: "));
        let anos = parseInt(prompt("Numero de anos: "));
        let interes_anual = 0;

        if (isNaN(cantidad) || isNaN(intereses || isNaN(anos)))
            document.writeln("Error")
        else {
            for (let i = 1; i <= anos; i += 1) {

                interes_anual += cantidad * (intereses / 100);
                cantidad = cantidad + interes_anual;
                document.writeln("Año: " + i + "<br>Cantidad: " + cantidad + "<br>Interes anual: " + interes_anual + "<br>");
            }
        }

    </script>
</body>

</html>
