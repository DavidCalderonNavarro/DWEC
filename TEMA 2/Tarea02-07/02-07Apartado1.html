<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>

<body>

    <h3>Ejercicio 1 Escribir un programa que pida al usuario una palabra y la muestre por pantalla 10 veces con for</h3>
    <br><br>

    <script>

        let cadena = prompt("Dime una palabra: ");

        for (var i = 1; i <= 10; i++) {

            document.writeln(cadena)

        }

    </script>

</body>

</html>
