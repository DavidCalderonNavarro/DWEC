<body>

    <h3>Ejercicio 13 Escribir un programa que muestre el eco de todo lo que el usuario introduzca hasta que el
        usuario escriba “salir” que terminará.</h3>
    <br><br>

    <script>

        let cadena;

        do {

            cadena = prompt("Dime algo: ");

            if (cadena == "salir") {
            } else {

                document.writeln(cadena + "<br>")

            }

        } while (cadena != "salir")

    </script>

</body>
