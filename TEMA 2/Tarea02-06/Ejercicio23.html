<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 23</title>
</head>
<body>

    <h1>Ejercicio 23</h1>
    <h3>Indica si un número ingresado es positivo, negativo o cero.</h3>

    <script>

        let numero = parseInt(prompt("Dime un numero: "));

        if(numero > 0){

            document.writeln("Tu numero es positivo");

        }else if(numero < 0){

            document.writeln("Tu numero es negativo");

        }else{

            document.writeln("Tu numero es cero");

        }

    </script>

</body>
</html>
