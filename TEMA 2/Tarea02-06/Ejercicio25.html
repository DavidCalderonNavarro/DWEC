<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 25</title>
</head>

<body>

    <h1>Ejercicio 25</h1>
    <h3>Muestra el nombre del Día de la semana correspondiente a un número del 1 al 7
        usando switch.</h3>

    <script>

        let num = parseInt(prompt("Dime un dia de la semana en numero(1-7): "));

        switch (num) {

            case 1:
                document.writeln("Lunes");
                break;
            case 2:
                document.writeln("Martes");
                break;
            case 3:
                document.writeln("Miercoles");
                break;
            case 4:
                document.writeln("Jueves");
                break;
            case 5:
                document.writeln("Viernes");
                break;
            case 6:
                document.writeln("Sabado");
                break;
            case 7:
                document.writeln("Domingo");
                break;
            default:
                document.writeln("Error");

        }

    </script>

</body>

</html>
