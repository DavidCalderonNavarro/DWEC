<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>

<body>

    <h1>Ejercicio 6</h1>
    <h3>crea un programa que lea el año que es y te diga si es bisiesto o no ( ayuda: modulo 4
        de el numero es 0)</h3>

    <script>

        let anio = parseInt(prompt("Dime un año: "));

        if(anio % 4 == 0){

            if(anio % 100 == 0){

                if(anio % 400 == 0){

                    document.writeln("Es bisiesto");

                }else{

                    document.writeln("No es bisiesto");

                }

            }else{

                document.writeln("Es bisiesto");

            }

        }else{

            document.writeln("No es bisiesto");

        }

    </script>

</body>

</html>
