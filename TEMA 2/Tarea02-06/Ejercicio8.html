<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>
</head>

<body>

    <h1>Ejercicio 8</h1>
    <h3>Solicitar al usuario un número de cliente. Si el número es el 1000, imprimir "Ganaste un
        premio".</h3>

        <script>

            let numero = parseInt(prompt("Dime un numero de cliente: "));

            if(numero == 1000){

                document.writeln("Ganaste un premio")

            }

        </script>

</body>

</html>
