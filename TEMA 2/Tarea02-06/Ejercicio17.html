<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 17</title>
</head>

<body>

    <h1>Ejercicio 17</h1>
    <h3>Hacer el ejercicio 14 con swicth</h3>

    <script>

        let opcion = prompt("Elige al candidato(A, B o C): ");

        switch (opcion) {

            case "A":
                document.writeln("Usted ha votado por el partido rojo");
                break;
            case "B":
                document.writeln("Usted ha votado por el partido verde");
                break;
            case "C":
                document.writeln("Usted ha votado por el partido azul");
                break;
            default:
                document.writeln("Opción errónea");
        }

    </script>

</body>

</html>
