<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 20</title>
</head>

<body>

    <h1>Ejercicio 20</h1>
    <h3>dado dos números, muestra cuál es mayor utilizando el operador ternario</h3>

    <script>

        let num1 = parseInt(prompt("Dime el primer numero: "));
        let num2 = parseInt(prompt("Dime el segundo numero: "));

        let resultado = (num1 > num2) ? "El primer numero es mayor" : "El segundo numero es mayor";

        document.writeln(resultado);

    </script>

</body>

</html>
