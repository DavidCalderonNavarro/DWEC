<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18</title>
</head>

<body>

    <h1>Ejercicio 18</h1>
    <h3>Pide un número y muestra si es par o impar usando el operador ternario.</h3>

    <script>

        let numero = parseInt(prompt("Dime un numero: "));

        let resultado = (numero % 2 == 0) ? "El numero es par" : "El numero es impar";

        document.writeln(resultado);

    </script>

</body>

</html>
