<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>

<body>
    <h1>Ejercicio 4</h1>
    <h3>crea un programa que lea tu fecha de nacimiento y te diga si eres menor de edad (-18) o en edad activa (+=18)
    </h3>

    <script>

        let dia = parseInt(prompt("Introduce tu día de nacimiento:"));
        let mes = parseInt(prompt("Introduce tu mes de nacimiento:"));
        let anio = parseInt(prompt("Introduce tu año de nacimiento:"));

        let hoy = new Date();
        let edad = hoy.getFullYear() - anio;

        if (
            hoy.getMonth() + 1 < mes ||
            (hoy.getMonth() + 1 === mes && hoy.getDate() < dia)
        ) {
            edad--;
        }

        if (edad < 18) {

            document.writeln("Eres menor de edad");

        } else {

            document.writeln("Estás en edad activa");

        }

    </script>

</body>

</html>
