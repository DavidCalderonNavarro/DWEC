<!DOCTYPE html>

<body>

    <h1>Ejercicio 10</h1>
    <h3>Solicitar al usuario que ingrese dos números y mostrar cuál de los dos es menor.
        Considerar el caso en que ambos números son iguales.</h3>

        <script>

            let numero1 = parseInt(prompt("Dime el primer numero: "));
            let numero2 = parseInt(prompt("Dime el segundo numero: "));

            if(numero1 < numero2){

                document.writeln("El menor es el " + numero1);

            }else if(numero2 < numero1){

                document.writeln("El menor es el " + numero2);

            }else{

                document.writeln("Tus numeros son iguales");

            }

        </script>

</body>

</html>
