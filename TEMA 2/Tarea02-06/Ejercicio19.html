<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 19</title>
</head>

<body>

    <h1>Ejercicio 19</h1>
    <h3>Verifica si una persona puede votar (mayor o igual a 18 años) usando el operador
        ternario.</h3>

    <script>

        let edad = parseInt(prompt("Dime tu edad: "));

        let resultado = (edad >= 18) ? "Eres mayor de edad" : "Eres menor de edad";

        document.writeln(resultado);

    </script>

</body>

</html>
