    <h1>Ejercicio 3</h1>
    <h3>crea un programa que lea tu fecha de nacimiento y te diga si eres menor de edad (-18)</h3>

    <script>

        let dia = parseInt(prompt("Introduce tu día de nacimiento:"));
        let mes = parseInt(prompt("Introduce tu mes de nacimiento:"));
        let anio = parseInt(prompt("Introduce tu año de nacimiento:"));

        let hoy = new Date();
        let edad = hoy.getFullYear() - anio;

            if (edad < 18) {

                document.writeln("No eres mayor de edad")

            } else {

                document.writeln("Eres mayor de edad")

            }
        

    </script>
