<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 24</title>
</head>

<body>

    <h1>Ejercicio 24</h1>
    <h3>Validar contraseña Verifica si una contraseña ingresada es igual a "admin123" y muestra
        un mensaje de acceso concedido o denegado.</h3>

    <script>

        let contraseña = prompt("Dime la contraseña: ");

        if(contraseña == "admin123"){

            document.writeln("Acceso concedido");

        }else{

            document.writeln("Acceso denegado");

        }

    </script>

</body>

</html>
