<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucles</title>
</head>

<body>

    <script>

        let fact = 5;
        let factvalor = 1;

        for (let i = 1; i <= fact; i++) {
            factvalor = factvalor * i;
        }

        document.writeln("Factorial de " + fact + " es " + factvalor);

        

    </script>

</body>

</html>
